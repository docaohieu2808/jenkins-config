# Jenkins controller built from this repo (Dockerfile + plugins.txt + casc.yaml).
#   cp .env.example .env   # fill it in
#   docker compose up -d --build --wait
# Add docker-compose.traefik.yml (-f ... -f ...) to publish it behind Traefik.
name: jenkins

services:
  jenkins:
    build: .
    image: jenkins-config:local
    container_name: jenkins
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in .env}
      JENKINS_PUBLIC_URL: ${JENKINS_PUBLIC_URL:-http://localhost:8080/}
      JENKINS_ADMIN_ADDRESS: ${JENKINS_ADMIN_ADDRESS:-Jenkins <jenkins@example.com>}
      K8S_SERVER_URL: ${K8S_SERVER_URL:?set K8S_SERVER_URL in .env}
      K8S_TOKEN: ${K8S_TOKEN:?set K8S_TOKEN in .env}
      K8S_CA_CERT_B64: ${K8S_CA_CERT_B64:?set K8S_CA_CERT_B64 in .env}
      JENKINS_AGENT_URL: ${JENKINS_AGENT_URL:?set JENKINS_AGENT_URL in .env}
      JENKINS_TUNNEL: ${JENKINS_TUNNEL:?set JENKINS_TUNNEL in .env}
      SHARED_LIB_REMOTE: ${SHARED_LIB_REMOTE:-https://git.example.com/group/jenkins-shared-library.git}
      GIT_USERNAME: ${GIT_USERNAME:-ci-bot}
      GIT_PASSWORD: ${GIT_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      # Both ports bind to one address, not every interface. Use an address the
      # Kubernetes agent pods can reach for the agent port (for example a VPN address).
      - "${JENKINS_BIND_IP:-127.0.0.1}:${JENKINS_PORT:-8080}:8080"
      - "${JENKINS_BIND_IP:-127.0.0.1}:${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  jenkins_home:
    # Explicit name so an existing controller keeps its data across project renames and upgrades.
    name: ${JENKINS_HOME_VOLUME:-jenkins_home}
